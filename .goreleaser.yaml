# goucrt release configuration.
# Documentation: https://goreleaser.com

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...

builds:
  - main: ./cmd/ucrt
    binary: ucrt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
    - amd64
    - arm64

# Custom-installable driver archives (deconz/shelly/tasmota, packaged for the remote's
# custom-driver installation feature) are built separately by `make custom-driver-archives` -
# GoReleaser has no way to place a build's binary at a archive subpath like bin/driver, which that
# format requires. Attached to the same GitHub release as plain downloads.
release:
  extra_files:
    - glob: custom-driver-dist/*.tar.gz

dockers:
- image_templates:
  - "ghcr.io/splattner/goucrt:v{{ .Version }}-amd64"
  dockerfile: "./build/Dockerfile"
  goarch: amd64
  use: buildx
  build_flag_templates:
  - "--platform=linux/amd64"
  - "--label=org.opencontainers.image.revision={{.FullCommit}}"
  - "--label=org.opencontainers.image.version={{.Version}}"
  extra_files: &dockers_extra_files
  - go.mod
- image_templates:
  - "ghcr.io/splattner/goucrt:v{{ .Version }}-arm64"
  dockerfile: "./build/Dockerfile"
  goarch: arm64
  use: buildx
  build_flag_templates:
  - "--platform=linux/arm64"
  - "--label=org.opencontainers.image.revision={{.FullCommit}}"
  - "--label=org.opencontainers.image.version={{.Version}}"
  extra_files: *dockers_extra_files
docker_manifests:
- name_template: "ghcr.io/splattner/goucrt:v{{ .Version }}"
  image_templates: &ghcr
    - "ghcr.io/splattner/goucrt:v{{ .Version }}-amd64"
    - "ghcr.io/splattner/goucrt:v{{ .Version }}-arm64"

  # For prereleases, updating `latest` and the floating tags of the major version does not make sense.
  # Only the image for the exact version should be pushed.
- name_template: "{{ if not .Prerelease }}ghcr.io/splattner/goucrt:v{{ .Major }}{{ end }}"
  image_templates: *ghcr
- name_template: "{{ if not .Prerelease }}ghcr.io/splattner/goucrt:v{{ end }}"
  image_templates: *ghcr
- name_template: "{{ if not .Prerelease }}ghcr.io/splattner/goucrt:latest{{ end }}"
  image_templates: *ghcr

sboms:
  - artifacts: archive
  - id: source # Two different sbom configurations need two different IDs
    artifacts: source
    
# signs our docker image
# https://goreleaser.com/customization/docker_sign
docker_signs:
  - cmd: cosign
    artifacts: images
    output: true
    args:
    - 'sign'
    - 'ghcr.io/splattner/goucrt@${digest}'
    - "--yes" # needed on cosign 2.0.0+

# signs the checksum file
# all files (including the sboms) are included in the checksum, so we don't need to sign each one if we don't want to
# https://goreleaser.com/customization/sign
signs:
- cmd: cosign
  certificate: '${artifact}.pem'
  args:
    - sign-blob
    - '--output-certificate=${certificate}'
    - '--output-signature=${signature}'
    # cosign v3 (pulled in by a sigstore/cosign-installer bump) defaults sign-blob to
    # --new-bundle-format=true and --use-signing-config=true, under which
    # --output-certificate/--output-signature are silently ignored and nothing is written to
    # --bundle (unset here), so cosign errors trying to open "" as the bundle path. Disabling only
    # --new-bundle-format still isn't enough: --use-signing-config independently demands --bundle
    # too (verified directly against cosign v3.0.6, the version installed in CI). Force the legacy
    # separate .pem/.sig layout goreleaser's `certificate`/`signature` template fields (and this
    # project's released asset names) expect.
    - '--new-bundle-format=false'
    - '--use-signing-config=false'
    - '${artifact}'
    - "--yes" # needed on cosign 2.0.0+
  artifacts: checksum
  output: true